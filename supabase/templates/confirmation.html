<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f4f5f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td style="font-size:28px;font-weight:600;color:#1f2933;padding-bottom:16px;">simple</td>
            </tr>
            <tr>
              <td style="font-size:20px;font-weight:600;color:#1f2933;padding-bottom:8px;">Confirm your email address</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:22px;color:#52606d;padding-bottom:24px;">Thanks for signing up for Simple. Confirm your email address to finish creating your account.</td>
            </tr>
            <tr>
              <td style="padding-bottom:24px;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#108a2e;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 24px;border-radius:999px;">Confirm email address</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:12px;line-height:18px;color:#7b8794;">If you didn't request this, you can safely ignore this email.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
